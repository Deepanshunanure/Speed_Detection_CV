calibrator:
  calibration_file_path: calibration.json
  chessboard_size:
  - 9
  - 6
  perspective_transform_enabled: false
  square_size_mm: 25.0
detector:
  background_learning_rate: 0.01
  background_subtraction_method: MOG2
  canny_threshold1: 50
  canny_threshold2: 150
  edge_detection_enabled: false
  max_contour_area: 50000.0
  min_contour_area: 500.0
logging:
  file_path: null
  level: INFO
  log_to_file: false
pipeline:
  enabled_components:
  - preprocessor
  - detector
  - tracker
  - speed_estimator
preprocessor:
  noise_reduction_kernel_size: 5
  noise_reduction_method: gaussian
  normalize_intensity: true
  target_resolution:
  - 1280
  - 720
speed_estimator:
  averaging_window_frames: 10
  min_trajectory_length: 2
  output_unit: m/s
tracker:
  max_disappeared_frames: 30
  max_tracking_distance: 50.0
  trajectory_history_length: 100
